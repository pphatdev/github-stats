services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Local: `docker compose up --build` builds and tags this.
    # CI deploy: APP_IMAGE=ghcr.io/pphatdev/github-stats:sha-xxxxxxx is pulled.
    image: ${APP_IMAGE:-github-stats:local}
    container_name: ${CLOUDFLARED_TUNNEL_NAME:-github-stats}-app
    restart: unless-stopped
    # Loopback only: public traffic arrives via the Cloudflare Tunnel (or the
    # host nginx in nginx/default.conf, which proxies to 127.0.0.1:3102).
    ports:
      - "127.0.0.1:3102:${PORT:-3000}"
    environment:
      NODE_ENV: production
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      WORKERS: ${WORKERS:-0}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlite}
      # Must live inside the app-data volume, so it is not taken from .env.
      DATABASE_URL: /app/data/stats.db
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_D1_DATABASE_ID: ${CLOUDFLARE_D1_DATABASE_ID:-}
      CLOUDFLARE_D1_TOKEN: ${CLOUDFLARE_D1_TOKEN:-}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SERVER_SALT: ${SERVER_SALT:-}
      WARMUP_USERNAME: ${WARMUP_USERNAME:-}
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ${CLOUDFLARED_TUNNEL_NAME:-github-stats}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel. Shares the app's network namespace, so the tunnel's
  # public hostname in the Cloudflare dashboard must point to
  # http://localhost:${PORT} (the container port, not 3102).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${CLOUDFLARED_TUNNEL_NAME:-github-stats}-cloudflared
    restart: unless-stopped
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in .env}
    # With a token, cloudflared ignores any tunnel-name argument.
    command: ["tunnel", "--no-autoupdate", "run"]

volumes:
  app-data:
  redis-data:

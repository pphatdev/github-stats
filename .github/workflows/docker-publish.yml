name: Docker Publish

# Builds the Docker image and pushes it to GHCR and Docker Hub. Deploying to the server is
# manual: pull the new tag there and run `docker compose up -d` (see
# docs/DEPLOYMENT.md, "Deploying a new version").
#
# Tags pushed:
#   push to `latest`       -> latest, <package.json version>, sha-<7-char commit>
#   GitHub release vX.Y.Z  -> X.Y.Z, X.Y, sha-<7-char commit>, and latest
#                             (unless the release is marked as a pre-release)
#
# Docker Hub (docker.io/<DOCKERHUB_USERNAME>/github-stats) is used only when
# both of these are set under Settings -> Secrets and variables -> Actions:
#   variable DOCKERHUB_USERNAME  Docker Hub user or organization
#   secret   DOCKERHUB_TOKEN     access token with Read & Write scope
# Without them the image goes to GHCR only and the run shows a warning.

on:
  push:
    branches: [latest]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; jobs opt in to what they need.
permissions: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/pphatdev/github-stats

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A release must match package.json, so `2.2.0` never means two images.
      - name: Check release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PKG: ${{ steps.pkg.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - id: hub
        name: Check Docker Hub settings
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME variable or DOCKERHUB_TOKEN secret not set; pushing to GHCR only."
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/github-stats,enable=${{ steps.hub.outputs.enabled }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.pkg.outputs.version }},enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name != 'release' || !github.event.release.prerelease }}
            type=sha,prefix=sha-,format=short

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.hub.outputs.enabled == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
